<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function() {
    try {
      var t = localStorage.getItem('farmwise_theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Finance — FarmWise AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/static/finance.css"/>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <a href="/" class="logo">🌱 Farm<span>Wise</span></a>
    <nav class="side-nav">
      <a href="/dashboard" class="side-link">📊 Dashboard</a>
      <a href="/animals" class="side-link">🐔 Animals</a>
      <a href="/feed" class="side-link">🌾 Feed</a>
      <a href="/finance" class="side-link active">💰 Finance</a>
      <a href="/inventory" class="side-link">📦 Inventory</a>
      <a href="/workers" class="side-link">👷 Workers</a>
      <a href="/assistant" class="side-link">✨ AI Assistant</a>
      <a href="/settings" class="side-link">⚙️ Settings</a>
    </nav>
    <button class="theme-toggle" onclick="toggleLightMode()" id="themeBtn">🌙 Toggle theme</button>
    <button class="logout-btn" id="logoutBtn">Log out</button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:14px">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
        <div>
          <div class="farm-name" id="farmName">Loading…</div>
          <div class="farm-sub" id="userGreeting"></div>
        </div>
      </div>
      <div class="topbar-right">
        <span class="badge" id="roleBadge"></span>
      </div>
    </header>

    <div class="content" id="pageContent" style="display:none">

      <div class="stat-grid">
        <div class="stat-card stat-card--income">
          <div class="stat-label">Income (30d)</div>
          <div class="stat-value" id="statIncome">—</div>
        </div>
        <div class="stat-card stat-card--expense">
          <div class="stat-label">Expenses (30d)</div>
          <div class="stat-value" id="statExpenses">—</div>
        </div>
        <div class="stat-card" id="profitCard">
          <div class="stat-label">Net Profit (30d)</div>
          <div class="stat-value" id="statProfit">—</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="entity-tabs" id="entityTabs">
          <span class="entity-tab active" data-tab="sales">Sales</span>
          <span class="entity-tab" data-tab="expenses">Expenses</span>
          <span class="entity-tab" data-tab="income">Income</span>
        </div>
        <button class="btn btn--primary" id="addBtn">+ New sale</button>
      </div>

      <div class="panel">
        <div id="salesTable"></div>
        <div id="expensesTable" style="display:none"></div>
        <div id="incomeTable" style="display:none"></div>
      </div>
    </div>

    <div class="content" id="noFarmState" style="display:none">
      <div class="empty-state">
        <div class="empty-icon">🌱</div>
        <h2>No farm yet</h2>
        <p>You'll need a farm before you can log sales, expenses, or income.</p>
      </div>
    </div>
  </main>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ═══════ New sale modal ═══════ -->
<div class="modal-overlay" id="saleModal">
  <div class="modal">
    <div class="modal-header">
      <h2>New sale</h2>
      <button class="modal-close" data-close="saleModal">✕</button>
    </div>
    <div class="alert alert--error" id="saleAlert"></div>
    <form id="saleForm">
      <div class="field"><label for="saleBatch">Batch <span style="font-weight:400">(optional)</span></label>
        <select id="saleBatch"><option value="">— Not tied to a batch —</option></select>
      </div>
      <div class="field-row">
        <div class="field"><label for="saleQuantity">Quantity</label><input id="saleQuantity" type="number" min="1" required></div>
        <div class="field"><label for="saleUnitPrice">Unit price</label><input id="saleUnitPrice" type="number" step="0.01" min="0" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="saleDiscount">Discount <span style="font-weight:400">(optional)</span></label><input id="saleDiscount" type="number" step="0.01" min="0" value="0"></div>
        <div class="field"><label for="saleDate">Sale date</label><input id="saleDate" type="date" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label for="saleBuyer">Buyer <span style="font-weight:400">(optional)</span></label><input id="saleBuyer"></div>
        <div class="field"><label for="salePayment">Payment method</label>
          <select id="salePayment">
            <option value="cash">Cash</option>
            <option value="ecocash">EcoCash</option>
            <option value="onemoney">OneMoney</option>
            <option value="bank_transfer">Bank transfer</option>
            <option value="card">Card</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="field"><label for="saleNotes">Notes <span style="font-weight:400">(optional)</span></label><textarea id="saleNotes" rows="2"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn btn--outline" data-close="saleModal">Cancel</button>
        <button type="submit" class="btn btn--primary" id="saleSubmitBtn">Log sale</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══════ New expense modal ═══════ -->
<div class="modal-overlay" id="expenseModal">
  <div class="modal">
    <div class="modal-header">
      <h2>New expense</h2>
      <button class="modal-close" data-close="expenseModal">✕</button>
    </div>
    <div class="alert alert--error" id="expenseAlert"></div>
    <form id="expenseForm">
      <div class="field"><label for="expenseCategory">Category</label>
        <select id="expenseCategory" required>
          <option value="feed">Feed</option>
          <option value="transport">Transport</option>
          <option value="electricity">Electricity</option>
          <option value="workers">Workers</option>
          <option value="fuel">Fuel</option>
          <option value="equipment">Equipment</option>
          <option value="maintenance">Maintenance</option>
          <option value="veterinary">Veterinary</option>
          <option value="utilities">Utilities</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label for="expenseAmount">Amount</label><input id="expenseAmount" type="number" step="0.01" min="0.01" required></div>
        <div class="field"><label for="expenseDate">Date</label><input id="expenseDate" type="date" required></div>
      </div>
      <div class="field"><label for="expenseVendor">Vendor <span style="font-weight:400">(optional)</span></label><input id="expenseVendor"></div>
      <div class="field"><label for="expenseNotes">Notes <span style="font-weight:400">(optional)</span></label><textarea id="expenseNotes" rows="2"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn btn--outline" data-close="expenseModal">Cancel</button>
        <button type="submit" class="btn btn--primary" id="expenseSubmitBtn">Log expense</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══════ New income modal ═══════ -->
<div class="modal-overlay" id="incomeModal">
  <div class="modal">
    <div class="modal-header">
      <h2>New income</h2>
      <button class="modal-close" data-close="incomeModal">✕</button>
    </div>
    <div class="alert alert--error" id="incomeAlert"></div>
    <form id="incomeForm">
      <div class="field"><label for="incomeCategory">Category</label>
        <select id="incomeCategory" required>
          <option value="animal_sales">Animal sales</option>
          <option value="egg_sales">Egg sales</option>
          <option value="milk_sales">Milk sales</option>
          <option value="manure">Manure</option>
          <option value="breeding">Breeding</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label for="incomeAmount">Amount</label><input id="incomeAmount" type="number" step="0.01" min="0.01" required></div>
        <div class="field"><label for="incomeDate">Date</label><input id="incomeDate" type="date" required></div>
      </div>
      <div class="field"><label for="incomeNotes">Notes <span style="font-weight:400">(optional)</span></label><textarea id="incomeNotes" rows="2"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn btn--outline" data-close="incomeModal">Cancel</button>
        <button type="submit" class="btn btn--primary" id="incomeSubmitBtn">Log income</button>
      </div>
    </form>
  </div>
</div>

<script src="/static/finance.js"></script>
</body>
</html>
